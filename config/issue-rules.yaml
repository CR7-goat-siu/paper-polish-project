# 问题登记与优先级规则（PRD §5 阶段二 / §4 维度体系）
#
# 所有审计 Skill 的 findings 结构各不相同，issue-registry 负责把它们归一成
# 统一的问题对象，并按本配置判定优先级（P0-P3）与所属质量维度。
# 改判级只改本文件，不动代码。

schema_version: 1

# 严重度 → 优先级 的默认映射（按 source + check 覆写时优先）
default_severity_to_priority:
  error: P1
  warning: P2
  info: P3

# 一级质量维度（PRD §4.1）与权重；scientific_truth 为硬门槛，不参与加权
# 注意：本项目用极简 YAML 解析器（utils/config_loader），不支持行内 flow map
# （写成 {label: x, weight: 1.0} 会原样解析成字符串），必须用缩进块样式。
dimensions:
  scientific_truth:
    label: 科学真实性
    weight: 0.0
    hard_gate: true
  contribution:
    label: 研究贡献
    weight: 1.0
  literature_novelty:
    label: 文献与创新性论证
    weight: 1.0
  method_rigor:
    label: 方法严谨性
    weight: 1.0
  experiment_sufficiency:
    label: 实验充分性
    weight: 1.0
  argument_structure:
    label: 论证与结构
    weight: 1.0
  reproducibility:
    label: 可复现性
    weight: 1.0
  academic_expression:
    label: 学术表达
    weight: 1.0
  figures_format:
    label: 图表与格式
    weight: 0.8
  review_risk:
    label: 审稿风险
    weight: 1.0

# 各来源 → 维度 的归属
source_dimension:
  review-gate: scientific_truth        # 保真类违例直接关系科学真实性
  claim-guard: scientific_truth        # 浮夸/绝对化断言影响主张真实性
  term-check: academic_expression
  lit-verify: literature_novelty
  submission-audit: review_risk
  issue-registry: argument_structure
  cite-manager: literature_novelty     # 引用表完整性（漏引/漏列/重复）
  lit-search: literature_novelty       # 文献支撑缺口（缺引/陈旧/信息不全）
  consistency-check: argument_structure # 跨节一致性默认归论证结构，细类见覆写
  stat-check: scientific_truth          # 统计报告重算不一致直接关系科学真实性
  review-sim: review_risk               # 模拟评审意见默认归审稿风险，细类见覆写
  journal-compliance: figures_format    # 期刊合规默认归图表格式，声明区细类见覆写

# 细粒度覆写：check / issue 命中时优先于 source_dimension
# 格式：source::check_or_issue -> dimension
dimension_overrides:
  "review-gate::objectivity.hype": contribution
  "review-gate::length": academic_expression
  "review-gate::similarity": academic_expression
  "review-gate::terminology": academic_expression
  "review-gate::hype_residue": contribution
  "review-gate::aiflavor": academic_expression
  "review-gate::paragraph_count": argument_structure
  "term-check::mixed_usage": academic_expression
  "term-check::coined_word": scientific_truth
  "lit-verify::rejected": scientific_truth
  "lit-verify::unverified": literature_novelty
  # 浮夸词按性质分流：最高级/领先性断言归贡献表述，强化词与口语归学术表达
  "claim-guard::absolute": contribution
  "claim-guard::hype": contribution
  "claim-guard::unsupported": scientific_truth
  "claim-guard::intensifier": academic_expression
  "claim-guard::informal": academic_expression
  "claim-guard::colloquial": academic_expression
  "claim-guard::redundant": academic_expression
  # 引用表完整性：越界引用与保真类同severity（正文引了不存在的条目）
  "cite-manager::out_of_bounds": scientific_truth
  # 跨节一致性细类：图表引用归图表格式，摘要数字归科学真实性
  "consistency-check::figure_reference": figures_format
  "consistency-check::table_reference": figures_format
  "consistency-check::orphan_caption": figures_format
  "consistency-check::abstract_number": scientific_truth
  # 统计报告一致性：p 值重算与 GRIM 全部归科学真实性
  "stat-check::decision_error": scientific_truth
  "stat-check::p_value_mismatch": scientific_truth
  "stat-check::grim_impossible_mean": scientific_truth
  # 期刊合规细类：声明区归审稿风险，章节结构归论证结构，字数关键词归学术表达
  "journal-compliance::declaration_missing": review_risk
  "journal-compliance::sections_missing": argument_structure
  "journal-compliance::sections_order": argument_structure
  "journal-compliance::word_limit_abstract": academic_expression
  "journal-compliance::word_limit_body": academic_expression
  "journal-compliance::keywords_range": academic_expression
  "journal-compliance::reference_style": literature_novelty

# 细粒度覆写：check / issue 命中时优先于 default_severity_to_priority
priority_overrides:
  # 保真类：数字/引用/公式/图表丢失或新增，一律阻断级
  "review-gate::numeric_missing": P0
  "review-gate::numeric_added": P0
  "review-gate::unit_loss": P0
  "review-gate::citation_missing": P0
  "review-gate::citation_added": P0
  "review-gate::citation_out_of_bounds": P0
  "review-gate::figure_missing": P0
  "review-gate::formula": P0
  "review-gate::paragraph_count": P1
  "review-gate::entity_missing": P1
  "review-gate::polarity_flips": P0
  "review-gate::scope_lost": P1
  # 文献造假/核验失败
  "lit-verify::rejected": P0
  "lit-verify::unverified": P1
  # 投稿审查的硬门禁
  "submission-audit::statistics": P0
  "submission-audit::evidence": P1
  "submission-audit::figures": P2
  "submission-audit::docx_structure": P1
  "submission-audit::placeholders": P2
  "submission-audit::fabrication_risk": P0
  # 浮夸与贡献表述
  "claim-guard::absolute": P1
  "claim-guard::hype": P1
  "review-gate::objectivity.hype": P1
  # 引用表完整性（cite-manager audit）
  "cite-manager::out_of_bounds": P0
  "cite-manager::uncited_entry": P3
  "cite-manager::duplicated_entry": P2
  "cite-manager::unparsable_marker": P2
  # 文献支撑缺口（lit-search gap，修复需 lit 管线，登记优先级）
  "lit-search::missing_citation": P2
  "lit-search::stale_citation": P3
  "lit-search::incomplete_entry": P3
  "lit-search::missing_entry": P0
  # 跨节一致性（consistency-check）
  "consistency-check::figure_reference": P1
  "consistency-check::table_reference": P1
  "consistency-check::orphan_caption": P2
  "consistency-check::abstract_number": P1
  "consistency-check::entity_consistency": P2
  # 统计报告一致性（stat-check，statcheck+GRIM 重算）
  "stat-check::decision_error": P1
  "stat-check::p_value_mismatch": P1
  "stat-check::grim_impossible_mean": P1
  # 期刊合规（journal-compliance，声明区缺失即 FAIL）
  "journal-compliance::declaration_missing": P1
  "journal-compliance::sections_order": P2
  "journal-compliance::word_limit_abstract": P2
  "journal-compliance::word_limit_body": P2
  "journal-compliance::keywords_range": P3
  "journal-compliance::figure_dpi": P2
  "journal-compliance::figure_format": P2
  "journal-compliance::reference_style": P3

# 去重指纹所用字段：同一 source + 同一 found/term/field + 同一上下文前 60 字 视为同一问题
dedup:
  context_chars: 60

# 评分规则（quality-score 用）：每个维度按未解决问题的加权严重度扣分
scoring:
  # 优先级 → 单条问题的扣分权重
  priority_penalty:
    P0: 4.0
    P1: 2.0
    P2: 1.0
    P3: 0.4
  # 单维度扣分达到该值时封顶为 0 分（避免问题数量线性压垮分数）
  dimension_penalty_cap: 6.0
  # 无任何问题时的维度满分
  base_score: 4.0

# 修改规划（revision-planner 用）
planning:
  # 事实约束：每个任务都继承，违反即被 review-gate 拦下
  fact_constraints:
    - 严禁新增原稿没有的数值、引用、单位与出处
    - 不得删除或淡化不利结果以改善观感
    - 极性方向与对冲强度必须与原文一致
    - 不得改动公式含义与方法事实
    - 结论必须严格受实验结果约束
  # 需要人工确认的来源：这些任务不自动改写，只登记
  # （lit-search 补文献须走检索→核验→insert 管线；cite-manager 改号须走 apply/renumber；
  #   consistency-check 的图表缺失/摘要数字冲突需要作者事实裁决——润色侧改号/改数
  #   会分别触发图表守恒与数字守恒门禁，自动修改必然 Fail-Closed）
  requires_human_sources:
    - lit-verify
    - lit-search
    - cite-manager
    - consistency-check
    - review-sim
  # 缺材料即阻断的维度（PRD §6.2：证据不足时暂停对该事实的实质性改写）
  material_blocked_dimensions:
    - method_rigor
    - experiment_sufficiency
    - reproducibility
  # 计划驱动修订（optimizer-loop build 用）：问题优先级 → 该 chunk 的润色强度
  # 未命中时用 revision_default_strength；P0 任务一律 requires_human，不进自动修订
  revision_default_strength: light
  priority_strength:
    P1: deep
    P2: light
    P3: light
