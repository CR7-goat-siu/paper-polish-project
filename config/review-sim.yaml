# review-sim 模拟同行评审配置（PRD：作业包出 / 响应进，fail-closed）
# 角色定义与章节覆盖；评审 rubric 正文在 prompts/<lang>/review-sim-<role>.md
schema_version: 1

roles:
  methodology:
    # 方法学严密性：方法描述、消融合理性、实现细节与声明是否自洽
    sections:
      - method
      - experiment
      - discussion
  statistics:
    # 统计与实验设计：指标、样本量、显著性声明、数据划分
    sections:
      - abstract
      - method
      - experiment
  domain_expert:
    # 领域背景与跨节逻辑闭环：基线选择、相关工作和结论的领域一致性
    sections:
      - abstract
      - introduction
      - related_work
      - method
      - experiment
      - discussion
      - conclusion
  novelty:
    # 贡献声明与实际方案的匹配度
    sections:
      - abstract
      - introduction
      - conclusion

cross_view:
  # 跨节比对视图：每个角色额外生成一个全文交叉作业
  enabled: true
  # 跨节作业中每个章节文本的截断长度（字符）
  max_chars_per_section: 6000
  # 跨节作业全文总截断长度（字符）
  max_chars_total: 24000

limits:
  # 每个作业最多返回的意见数
  max_findings_per_job: 8
  # 原文锚点（exact_source_quote）最小长度：过短的"引用"无法核验
  min_quote_chars: 12

# 响应校验（fail-closed）
validation:
  # 锚点匹配前对双方文本做空白归一（折叠连续空白），仍要求逐字符子串匹配
  normalize_whitespace: true
  # 必填字段：缺任一项该条意见作废
  required_fields:
    - issue_category
    - claim_or_defect_summary
    - exact_source_quote
    - line_or_paragraph_locator
    - rationale
  # 严重度建议 → issue-registry severity 映射（review-sim 永不产出 error）
  severity_map:
    major: warning
    minor: info

# 对抗闭环（optimizer-loop decide 轮接入，R1）
loop:
  # decide 接受修订后自动对最佳版本发射评审周期
  enabled: true
  # 只评审相对上一轮有改动的章节（diff_sections 确定性切分）
  review_changed_only: true
  # 每个评审周期附带全文交叉比对作业
  include_cross: true
  # 评审周期总数上限
  max_review_cycles: 8
  # ARIS 止损纪律：连续 N 轮评审无新增且无收敛 → 切换角色组合
  stagnation_rotate_after: 2
  # 连续 N 轮无进展 → 停止循环、升级人工复核
  stagnation_stop_after: 4
  # 角色轮换后备组合
  alternate_roles:
    - methodology
    - statistics
  # 评审意见作为批注注入下一轮修订（永不直接改写正文，requires_human 保持）
  guidance_injection: true
